name: Backend and Emulator Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Node 24 host / Firebase companion runtimes
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Firebase Node companion
        uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'

      - name: Record Firebase Node companion
        shell: bash
        run: echo "BETTER_KEEP_FIREBASE_NODE_BIN=$(command -v node)" >> "${GITHUB_ENV}"

      - name: Set up host Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install Firebase Java companion
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.11'

      - name: Record Firebase Java companion
        shell: bash
        run: echo "BETTER_KEEP_FIREBASE_JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"

      - name: Set up host Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install dependencies
        run: |
          npm ci
          npm run ci:functions

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install matched Chrome and ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter sources
        run: npm run analyze:firebase-environment

      - name: Run client policy and unit suites
        env:
          CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_BINARY: ${{ steps.setup-chrome.outputs.chromedriver-path }}
        run: |
          npm run test:windows-build-policy
          npm run test:oauth-recovery
          npm run test:client-sync
          npm run test:firebase-emulator-config
          npm run test:firebase-apple
          npm run test:firebase-environment-web

      - name: Validate runtime and Functions
        run: |
          node --version
          java -version
          npm run firebase:runtime-check
          npm run firebase:emulator-runtime-check
          npm run test:firebase-runtime
          npm run test:functions
          npm run audit:runtime
          npm run audit:functions

      - name: Run emulator suites without legacy runtime warnings
        shell: bash
        run: |
          set -euo pipefail
          runtime_log="${RUNNER_TEMP}/firebase-emulator-runtime.log"
          {
            npm run test:firebase-rules
            npm run test:firebase-emulator-functions
            npm run test:firebase-emulator-review
          } 2>&1 | tee "${runtime_log}"

          if grep -E 'DEP0169|Unsafe::arrayBaseOffset' "${runtime_log}"; then
            echo "Legacy Node or Java runtime warning detected."
            exit 1
          fi

  windows-build:
    name: Windows release compile
    runs-on: windows-2025-vs2026
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Report Windows toolchain
        run: flutter doctor -v

      - name: Build Windows release
        run: flutter build windows --release

      - name: Reject legacy coroutine flags
        shell: pwsh
        run: |
          $pluginProjects = @(
            "build/windows/x64/plugins/gal/gal_plugin.vcxproj",
            "build/windows/x64/plugins/permission_handler_windows/permission_handler_windows_plugin.vcxproj"
          )

          foreach ($project in $pluginProjects) {
            if (-not (Test-Path $project)) {
              throw "Expected generated plugin project was not found: $project"
            }
            if (Select-String -Path $project -Pattern "/await" -SimpleMatch -Quiet) {
              throw "Legacy /await compiler option remains in $project"
            }
          }
